repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]


  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.9
    hooks:
      - id: biome-check
        files: ^apps/web/

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: bash -c "npx --prefix apps/web tsc --noEmit -p apps/web/tsconfig.json"
        language: system
        files: ^apps/web/src/
        pass_filenames: false
