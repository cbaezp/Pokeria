repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]


  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.9
    hooks:
      - id: biome-check
        files: ^apps/web/

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: bash -c "npx --prefix apps/web tsc --noEmit -p apps/web/tsconfig.json"
        language: system
        files: ^apps/web/src/
        pass_filenames: false

      - id: frontend-tests
        name: frontend tests (vitest)
        entry: bash -c "npm --prefix apps/web test"
        language: system
        files: ^apps/web/
        pass_filenames: false

      - id: backend-tests
        name: backend unit tests (pytest)
        entry: bash -c ".venv/bin/pytest tests/unit/poker/ tests/unit/learner/ tests/unit/curriculum/ tests/unit/training/"
        language: system
        files: ^(apps/api/|tests/)
        pass_filenames: false
