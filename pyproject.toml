[project]
name = "pokerlab"
version = "0.1.0"
description = "Pokeria - Open-source, self-hosted, personalized poker training platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "cbaezp", email = "91438023+cbaezp@users.noreply.github.com" },
]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.12",
]

[project.urls]
Homepage = "https://github.com/cbaezp/Pokeria"
Repository = "https://github.com/cbaezp/Pokeria"
Issues = "https://github.com/cbaezp/Pokeria/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "hypothesis>=6.100.0",
    "treys>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "apps/web", "dist", "build", ".next", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (standard for FastAPI Depends)
    "UP038", # isinstance with tuple is faster in CPython than union syntax
]


[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["apps/api", "apps/ml"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["node_modules", ".venv", ".next", "dist", "build", "*.egg-info", "apps/web/node_modules", ".hypothesis", "data"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --capture=sys --strict-markers -p no:anyio"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "alembic.*",
    "treys.*",
]
ignore_missing_imports = true
